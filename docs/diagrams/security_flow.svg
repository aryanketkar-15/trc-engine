<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2a5c">Security flow: from security objectives to security requirements</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#475569">Example: connected smart door lock, asset AS-1 "Unlock command"</text>

  <!-- step boxes -->
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="75" width="145" height="150" rx="9" fill="#eef2f7" stroke="#64748b"/>
    <text x="92" y="98" font-weight="bold" fill="#1f2a5c">1. Security objectives</text>
    <text x="92" y="118" font-size="10.5">per asset, yes / no:</text>
    <text x="92" y="136" font-size="10.5">Confidentiality: no</text>
    <text x="92" y="151" font-size="10.5">Integrity: yes</text>
    <text x="92" y="166" font-size="10.5">Availability: yes</text>
    <text x="92" y="181" font-size="10.5">Authenticity: yes</text>
    <text x="92" y="212" font-size="10" fill="#475569">Team 1 (asset agent)</text>

    <rect x="185" y="75" width="145" height="150" rx="9" fill="#f0f9ff" stroke="#0369a1"/>
    <text x="257" y="98" font-weight="bold" fill="#0c4a6e">2. Threats (STRIDE)</text>
    <text x="257" y="118" font-size="10.5">which objective can be</text>
    <text x="257" y="133" font-size="10.5">attacked, with evidence</text>
    <text x="257" y="153" font-size="10.5">e.g. Spoofing /</text>
    <text x="257" y="168" font-size="10.5">Tampering: replay of a</text>
    <text x="257" y="183" font-size="10.5">BLE unlock command</text>
    <text x="257" y="212" font-size="10" fill="#0369a1">Threat Agent</text>

    <rect x="350" y="75" width="145" height="150" rx="9" fill="#f0f9ff" stroke="#0369a1"/>
    <text x="422" y="98" font-weight="bold" fill="#0c4a6e">3. Risk</text>
    <text x="422" y="118" font-size="10.5">impact: S / F / O / P</text>
    <text x="422" y="133" font-size="10.5">feasibility: 5 factors</text>
    <text x="422" y="153" font-size="10.5">impact x feasibility</text>
    <text x="422" y="168" font-size="10.5">= risk, ranked per asset</text>
    <text x="422" y="183" font-size="10.5">with a written reason</text>
    <text x="422" y="212" font-size="10" fill="#0369a1">Risk Agent</text>

    <rect x="515" y="75" width="145" height="150" rx="9" fill="#f0f9ff" stroke="#0369a1"/>
    <text x="587" y="98" font-weight="bold" fill="#0c4a6e">4. Treatment</text>
    <text x="587" y="118" font-size="10.5">Reduce / Share /</text>
    <text x="587" y="133" font-size="10.5">Retain / Avoid</text>
    <text x="587" y="153" font-size="10.5">+ residual risk</text>
    <text x="587" y="168" font-size="10.5">severe risks are</text>
    <text x="587" y="183" font-size="10.5">reduced; the rest stay</text>
    <text x="587" y="198" font-size="10.5">as residual risk</text>
    <text x="587" y="215" font-size="10" fill="#0369a1">Risk Agent + expert</text>

    <rect x="680" y="75" width="125" height="150" rx="9" fill="#f0f9ff" stroke="#0369a1"/>
    <text x="742" y="98" font-weight="bold" fill="#0c4a6e">5. Resistance</text>
    <text x="742" y="118" font-size="10.5">attacker class to</text>
    <text x="742" y="133" font-size="10.5">resist, then JIL,</text>
    <text x="742" y="148" font-size="10.5">SESIP and CC EAL</text>
    <text x="742" y="168" font-size="10.5">(AVA_VAN level)</text>
    <text x="742" y="212" font-size="10" fill="#0369a1">Compliance mapping</text>

    <rect x="825" y="75" width="115" height="150" rx="9" fill="#eef2f7" stroke="#64748b"/>
    <text x="882" y="98" font-weight="bold" fill="#1f2a5c">6. Requirements</text>
    <text x="882" y="118" font-size="10.5">one testable</text>
    <text x="882" y="133" font-size="10.5">requirement per</text>
    <text x="882" y="148" font-size="10.5">"Reduce" threat,</text>
    <text x="882" y="163" font-size="10.5">with verification</text>
    <text x="882" y="212" font-size="10" fill="#475569">Team 3</text>
  </g>
  <g stroke="#374151" stroke-width="2" marker-end="url(#a)">
    <path d="M165,150 H185"/><path d="M330,150 H350"/><path d="M495,150 H515"/><path d="M660,150 H680"/><path d="M805,150 H825"/>
  </g>

  <!-- human gate band -->
  <rect x="20" y="245" width="920" height="64" rx="10" fill="#e6f4ea" stroke="#2f855a"/>
  <text x="480" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#22543d">Human decision at every step (the AI proposes, the expert decides)</text>
  <g font-size="10.5" fill="#22543d" text-anchor="middle">
    <text x="257" y="286">approve, reject with reason,</text><text x="257" y="299">prune or add a threat</text>
    <text x="422" y="286">accept, edit ratings,</text><text x="422" y="299">reject with reason</text>
    <text x="587" y="286">adjust the risk (reason),</text><text x="587" y="299">choose the treatment</text>
    <text x="742" y="286">confirm or override</text><text x="742" y="299">the attacker class</text>
    <text x="92" y="286">expert reviews</text><text x="92" y="299">the asset table</text>
    <text x="882" y="286">expert reviews</text><text x="882" y="299">the requirements</text>
  </g>
  <g stroke="#2f855a" stroke-width="1.5" stroke-dasharray="3 3">
    <path d="M92,225 V245"/><path d="M257,225 V245"/><path d="M422,225 V245"/><path d="M587,225 V245"/><path d="M742,225 V245"/><path d="M882,225 V245"/>
  </g>

  <!-- worked example -->
  <rect x="20" y="330" width="920" height="125" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="34" y="352" font-size="13" font-weight="bold" fill="#1f2a5c">Worked example (door lock, AS-1)</text>
  <g font-size="11" fill="#1f2937">
    <text x="34" y="374">1. Integrity and Authenticity of the unlock command are required.</text>
    <text x="34" y="392">2. Threat: an attacker replays a captured BLE unlock command (Spoofing / Tampering, CAPEC-94).</text>
    <text x="34" y="410">3. Impact Severe (operational) with Medium feasibility gives High risk. It ranks first for AS-1.</text>
    <text x="34" y="428">4. Treatment Reduce: add a fresh nonce and a signature check. Residual risk Low (a compromised key remains).</text>
    <text x="34" y="446">5. Resistance: Moderate attacker class, JIL High, SESIP 3, EAL4+ (AVA_VAN.4).   6. A requirement is written and traced to this threat.</text>
  </g>

  <!-- change loop -->
  <path d="M882,455 V500 H92 V455" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="480" y="520" text-anchor="middle" font-size="11.5" fill="#b45309" font-weight="bold">Change loop: if an asset, system model or use case changes upstream, the affected threats, risks and mappings are marked stale and only those are redone</text>
  <text x="480" y="540" text-anchor="middle" font-size="10.5" fill="#6b7280">Every decision (who, what, why) is stored in the audit log; only approved results reach the shared state.</text>
</svg>
