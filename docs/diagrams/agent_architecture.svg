<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2a5c">SCRP agent architecture: who produces what, and where people decide</text>

  <!-- Team 1 -->
  <rect x="20" y="60" width="190" height="300" rx="10" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="115" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a5c">Team 1</text>
  <text x="115" y="102" text-anchor="middle" font-size="11" fill="#475569">item, use cases, assets</text>
  <rect x="35" y="115" width="160" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="115" y="142" text-anchor="middle" font-size="12">Use-case agent</text>
  <rect x="35" y="170" width="160" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="115" y="197" text-anchor="middle" font-size="12">Modelling agent (DFD)</text>
  <rect x="35" y="225" width="160" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="115" y="252" text-anchor="middle" font-size="12">Asset agent (C/I/A/Auth)</text>
  <rect x="35" y="290" width="160" height="56" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="115" y="312" text-anchor="middle" font-size="11" font-weight="bold">Hand-off contract</text>
  <text x="115" y="328" text-anchor="middle" font-size="10.5">product, use cases, assets</text>
  <text x="115" y="341" text-anchor="middle" font-size="10.5">(yes/no properties)</text>

  <!-- Team 2 -->
  <rect x="250" y="60" width="480" height="300" rx="10" fill="#f0f9ff" stroke="#0369a1"/>
  <text x="490" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">Team 2: Threat, Risk and Compliance agents</text>

  <rect x="265" y="105" width="140" height="92" rx="8" fill="#fff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="335" y="128" text-anchor="middle" font-size="13" font-weight="bold">Threat Agent</text>
  <text x="335" y="146" text-anchor="middle" font-size="10.5">search catalogues,</text>
  <text x="335" y="159" text-anchor="middle" font-size="10.5">write scenarios (STRIDE),</text>
  <text x="335" y="172" text-anchor="middle" font-size="10.5">check evidence</text>
  <text x="335" y="188" text-anchor="middle" font-size="10" fill="#0369a1">one run per use case</text>

  <rect x="425" y="105" width="140" height="92" rx="8" fill="#fff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="495" y="128" text-anchor="middle" font-size="13" font-weight="bold">Risk Agent</text>
  <text x="495" y="146" text-anchor="middle" font-size="10.5">impact (S/F/O/P),</text>
  <text x="495" y="159" text-anchor="middle" font-size="10.5">feasibility, risk, rank</text>
  <text x="495" y="172" text-anchor="middle" font-size="10.5">per asset, treatment</text>
  <text x="495" y="188" text-anchor="middle" font-size="10" fill="#0369a1">+ residual risk</text>

  <rect x="585" y="105" width="130" height="92" rx="8" fill="#fff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="650" y="128" text-anchor="middle" font-size="13" font-weight="bold">Resistance</text>
  <text x="650" y="146" text-anchor="middle" font-size="10.5">required attacker</text>
  <text x="650" y="159" text-anchor="middle" font-size="10.5">resistance: JIL, SESIP,</text>
  <text x="650" y="172" text-anchor="middle" font-size="10.5">CC EAL (rule base)</text>

  <path d="M405,151 H425" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M565,151 H585" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- human gates -->
  <g fill="#e6f4ea" stroke="#2f855a">
    <rect x="270" y="215" width="130" height="40" rx="20"/>
    <rect x="430" y="215" width="130" height="40" rx="20"/>
    <rect x="590" y="215" width="120" height="40" rx="20"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#22543d">
    <text x="335" y="232">Expert: approve, reject</text><text x="335" y="246">(reason), prune, add</text>
    <text x="495" y="232">Expert: accept, edit, reject,</text><text x="495" y="246">adjust risk, decide treatment</text>
    <text x="650" y="232">Expert: confirm,</text><text x="650" y="246">override, reject</text>
  </g>
  <path d="M335,197 V215" stroke="#2f855a" stroke-width="1.6" marker-end="url(#g)"/>
  <path d="M495,197 V215" stroke="#2f855a" stroke-width="1.6" marker-end="url(#g)"/>
  <path d="M650,197 V215" stroke="#2f855a" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="490" y="282" text-anchor="middle" font-size="11" fill="#22543d" font-weight="bold">Human in the loop: nothing moves on without a named approver and a recorded reason</text>

  <!-- change loop -->
  <path d="M700,348 H270" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="490" y="322" text-anchor="middle" font-size="10.5" fill="#b45309">upstream change: stale threats, risks and mappings are detected,</text>
  <text x="490" y="335" text-anchor="middle" font-size="10.5" fill="#b45309">and only the affected assets are redone</text>

  <!-- knowledge + tables -->
  <rect x="250" y="375" width="235" height="62" rx="8" fill="#fff" stroke="#6b7280"/>
  <text x="367" y="396" text-anchor="middle" font-size="12" font-weight="bold">Knowledge base (pgvector)</text>
  <text x="367" y="412" text-anchor="middle" font-size="10.5">CAPEC, CWE, ATT&amp;CK, STRIDE (2,300)</text>
  <text x="367" y="426" text-anchor="middle" font-size="10.5">CC, CEM, JIL, EU CRA text (5,097)</text>
  <rect x="495" y="375" width="235" height="62" rx="8" fill="#fff" stroke="#6b7280"/>
  <text x="612" y="396" text-anchor="middle" font-size="12" font-weight="bold">Rating tables and rule base</text>
  <text x="612" y="412" text-anchor="middle" font-size="10.5">ratings.json (risk matrix, points)</text>
  <text x="612" y="426" text-anchor="middle" font-size="10.5">rules.json (attacker class, SESIP, EAL)</text>
  <path d="M335,375 V362" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)" transform="translate(0,-2)"/>
  <path d="M612,375 V362" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)" transform="translate(0,-2)"/>

  <!-- Team 3 -->
  <rect x="770" y="60" width="170" height="300" rx="10" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="855" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a5c">Team 3</text>
  <text x="855" y="102" text-anchor="middle" font-size="11" fill="#475569">requirements and audit</text>
  <rect x="785" y="115" width="140" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="855" y="142" text-anchor="middle" font-size="12">Requirements agent</text>
  <rect x="785" y="170" width="140" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="855" y="197" text-anchor="middle" font-size="12">Trace / Audit agent</text>
  <rect x="785" y="225" width="140" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="855" y="252" text-anchor="middle" font-size="12">Consistency agent</text>
  <rect x="785" y="290" width="140" height="56" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="855" y="312" text-anchor="middle" font-size="11" font-weight="bold">Reads approved only</text>
  <text x="855" y="328" text-anchor="middle" font-size="10.5">threat, risk, treatment,</text>
  <text x="855" y="341" text-anchor="middle" font-size="10.5">residual risk, resistance</text>

  <path d="M210,210 H250" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <path d="M730,210 H770" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- SCRS -->
  <rect x="20" y="470" width="920" height="92" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="480" y="495" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">SCRS: shared reasoning state and audit log (approved results only)</text>
  <g font-size="11" text-anchor="middle" fill="#431407">
    <rect x="40" y="508" width="200" height="40" rx="6" fill="#fff" stroke="#c2410c"/>
    <text x="140" y="525">threat_scenarios</text><text x="140" y="540" font-size="10">project / use case / asset / tid</text>
    <rect x="255" y="508" width="200" height="40" rx="6" fill="#fff" stroke="#c2410c"/>
    <text x="355" y="525">risk_assessments</text><text x="355" y="540" font-size="10">+ treatment, residual risk</text>
    <rect x="470" y="508" width="200" height="40" rx="6" fill="#fff" stroke="#c2410c"/>
    <text x="570" y="525">compliance_records</text><text x="570" y="540" font-size="10">JIL, SESIP, EAL per threat</text>
    <rect x="685" y="508" width="235" height="40" rx="6" fill="#fff" stroke="#c2410c"/>
    <text x="802" y="525">audit_log + revision_history</text><text x="802" y="540" font-size="10">who decided what, and why</text>
  </g>
  <path d="M495,437 V470" stroke="#c2410c" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="505" y="458" font-size="10.5" fill="#7c2d12">every approved result is written here</text>
</svg>
