[project]
name = "trc-engine"
version = "0.1.0"
description = "AI-Assisted Threat–Risk–Compliance Engine — Phase 1: Threat Agent"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["docs/"]

[tool.ruff.lint]
# Rule sets active for this project (Day-1 agreed baseline)
#   E/W  – pycodestyle errors & warnings
#   F    – Pyflakes (unused imports, undefined names, etc.)
#   I    – isort (import ordering)
#   N    – pep8-naming
#   UP   – pyupgrade (modern Python idioms)
#   B    – flake8-bugbear (likely bugs & design issues)
#   SIM  – flake8-simplify
#   ANN  – flake8-annotations (type hint coverage enforcement)
#   S    – flake8-bandit (security checks — critical for a cybersecurity project)
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ANN", "S"]
ignore = [
    "S101",    # 'assert' — allow in test files (bandit)
    "UP042",   # StrEnum is preferred by UP042, but str+Enum is used intentionally
               # for Pydantic v2 StrEnum serialization compatibility — suppress globally
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]   # asserts + unannotated test helpers are fine

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
