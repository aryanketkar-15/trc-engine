name: CI

on:
  push:
    branches: ["main", "develop", "feat/**", "fix/**", "ci/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    name: Lint, Build KB & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: trc_engine
          POSTGRES_USER: trc_user
          POSTGRES_PASSWORD: trc_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trc_user -d trc_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://trc_user:trc_password@localhost:5432/trc_engine
      TRC_INTEGRATION_TESTS: "1"
      USE_LIVE_LLM: "false"
      OPENAI_API_KEY: "sk-mock-key-for-ci"
      THREAT_AGENT_API_KEY: "trc-dev-secret-key"
      KB_DATA_DIR: "kb/data"
      ENVIRONMENT: "development"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" sentence-transformers httpx

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Build Knowledge Base Index (pgvector)
        run: |
          python -m kb.scripts.build_index

      - name: Run Full Integration Test Suite
        run: |
          pytest tests/ -v
