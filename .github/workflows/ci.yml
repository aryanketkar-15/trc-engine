name: CI

on:
  push:
    branches: ["main", "develop", "feat/**", "fix/**", "ci/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    name: Lint, Build KB & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: trc_engine
          POSTGRES_USER: trc_user
          POSTGRES_PASSWORD: trc_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trc_user -d trc_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://trc_user:trc_password@localhost:5432/trc_engine
      TRC_INTEGRATION_TESTS: "1"
      USE_LIVE_LLM: "false"
      OPENAI_API_KEY: "sk-mock-key-for-ci"
      THREAT_AGENT_API_KEY: "trc-dev-secret-key"
      KB_DATA_DIR: "kb/data"
      ENVIRONMENT: "development"
      PYTHONPATH: "."

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              p = tomllib.load(f)
          reqs = p['project']['dependencies'] + p['project']['optional-dependencies']['dev']
          print('\n'.join(reqs))
          " > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt sentence-transformers httpx

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Build Knowledge Base Index (pgvector)
        run: |
          python -m kb.scripts.build_index

      - name: Run Full Integration Test Suite
        id: pytest_run
        continue-on-error: true
        run: |
          set -o pipefail
          pytest tests/ -v --tb=short 2>&1 | tee pytest.log

      - name: Report Test Results to Summary
        run: |
          if [ "${{ steps.pytest_run.outcome }}" != "success" ]; then
            echo "### ❌ Pytest Failures" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -A 50 "FAILURES" pytest.log | head -n 120 >> $GITHUB_STEP_SUMMARY || tail -n 80 pytest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "### ✅ All Tests Passed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 25 pytest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
