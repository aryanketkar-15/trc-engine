services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trc-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trc_engine}
      POSTGRES_USER: ${POSTGRES_USER:-trc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trc_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trc_user} -d ${POSTGRES_DB:-trc_engine}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The API itself: docker compose --profile app up --build
  api:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trc_user}:${POSTGRES_PASSWORD:-trc_password}@postgres:5432/trc_engine_fullkb
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - trcdata:/data

volumes:
  pgdata:
  trcdata:
